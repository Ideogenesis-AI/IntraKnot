[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
  "src/", "tests/", "manual/",
  "README.md", "LICENSE",
  "pyproject.toml",
]

[tool.hatch.build.targets.wheel.force-include]
"manual" = "intraknot/manual"

[project]
name = "intraknot"
version = "0.1.3"
description = "IntraKnot: HPC management for tensor network and AI studies of quantum lattice models"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Changkai Zhang", email = "changkai.zhang@lmu.de" }]
keywords = [
  "tensor-network", "hpc", "quantum", "lattice", "pytorch",
  "symmetry", "neural-network", "dmrg",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "alice-net>=0.2.6",
  "nicole>=0.3.7",
  "numpy>=2.0",
  "torch>=2.5",
  "pyyaml>=6.0",
  "click>=8.1",
  "textual>=0.52",
]

[project.scripts]
iknot = "intraknot.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "hypothesis>=6.0",
  "pytest-benchmark>=4.0",
]

lint = [
  "ruff>=0.6",
  "mypy>=1.8",
]

[tool.uv.sources]
alice = { path = "../alice", editable = true }
nicole = { path = "../nicole", editable = true }

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
